apiVersion: v1
kind: Service
metadata:
  name: {{ include "gptc.fullname" . }}
  labels: {{- include "gptc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "gptc.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
    - {name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics}
---
# Stable per-pod DNS for peers to reach each other; published before readiness
# so replicas can forward during startup.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gptc.fullname" . }}-headless
  labels: {{- include "gptc.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "gptc.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
