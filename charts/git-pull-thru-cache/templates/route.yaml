{{- if .Values.route.enabled }}
{{- if not .Values.route.host }}{{ fail "route.host is required" }}{{ end }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "gptc.fullname" . }}
  labels: {{- include "gptc.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ .Values.route.host }}
  to:
    kind: Service
    name: {{ include "gptc.fullname" . }}
  port:
    targetPort: http
  {{- with .Values.route.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
